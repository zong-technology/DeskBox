<!doctype html><html lang="zh"><meta charset="utf-8"><style>body{margin:18px;background:#0b1722;color:#e4f3ff;font:13px system-ui}button{background:#57dcea;color:#06131d;border:0;border-radius:6px;padding:8px 14px;font-weight:700}a{color:#72e6f4;display:block;margin:8px 0}p{line-height:1.65}</style><h3>DeskBox V4.1 · 实时语音原型</h3><p>仅在原有 DeskBox 文件中运行。生成可编辑 Section 并保留原语音稿。</p><button id="go">创建 / 定位原型 Section</button><div id="state"></div><script>const state=document.getElementById('state'), go=document.getElementById('go');go.onclick=()=>{go.disabled=true;state.textContent='正在写入可编辑图层与原型连线…';parent.postMessage({pluginMessage:{type:'build'}},'*')};onmessage=({data})=>{const m=data.pluginMessage;if(!m)return;go.disabled=false;if(m.type==='error'){state.textContent=m.message;return}const r=m.result;state.textContent=r.existing?'已定位原型':'已创建原型';for(const [label,id] of [['主线',r.main[0]],['打断分支',r.main[3]],['减少动效',r.reduced[0]]]){if(!id)continue;const a=document.createElement('a');a.textContent=label;a.target='_blank';a.href='https://www.figma.com/proto/jdAhri31Qx53x6T4gG4a9D/DeskBox?node-id='+id.replace(':','-')+'&starting-point-node-id='+id.replace(':','-')+'&scaling=contain';state.append(a);}};</script></html>
