name: DeskBox unsigned iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [release/ios-hologram-0.7.0]
  pull_request:
    paths: ['mobile/DeskBoxMobile/**', 'tools/mobile-hologram-check.swift', 'tools/ios-hologram-smoke.sh', 'tools/build-ios-unsigned-ipa.sh', '.github/workflows/ios-unsigned-ipa.yml']
permissions:
  contents: read
jobs:
  unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check existing briefing, offline sync and endpoint rules
        run: |
          swiftc mobile/DeskBoxMobile/DeskBoxMobile/Models.swift mobile/DeskBoxMobile/DeskBoxMobile/OfflineStore.swift mobile/DeskBoxMobile/DeskBoxMobile/BriefingRules.swift mobile/DeskBoxMobile/DeskBoxMobile/SyncEndpoint.swift mobile/DeskBoxMobile/DeskBoxMobile/CloudAccount.swift tools/mobile-briefing-check.swift -o "$RUNNER_TEMP/briefing-check"
          "$RUNNER_TEMP/briefing-check"
      - name: Check live protocol, history, cached tools and speech motion
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-qa"
          swiftc mobile/DeskBoxMobile/DeskBoxMobile/Models.swift mobile/DeskBoxMobile/DeskBoxMobile/OfflineStore.swift mobile/DeskBoxMobile/DeskBoxMobile/HologramProtocol.swift mobile/DeskBoxMobile/DeskBoxMobile/HologramHistory.swift mobile/DeskBoxMobile/DeskBoxMobile/HologramLocalTools.swift tools/mobile-hologram-check.swift -o "$RUNNER_TEMP/hologram-check"
          "$RUNNER_TEMP/hologram-check" | tee "$RUNNER_TEMP/mobile-qa/hologram-check.log"
      - name: Reproduce long replies and delayed packets with native offline audio
        run: |
          swiftc mobile/DeskBoxMobile/DeskBoxMobile/HologramProtocol.swift mobile/DeskBoxMobile/DeskBoxMobile/HologramPlayback.swift mobile/DeskBoxMobile/DeskBoxMobile/HologramInputGate.swift tools/mobile-audio-check.swift -o "$RUNNER_TEMP/audio-check"
          "$RUNNER_TEMP/audio-check" | tee "$RUNNER_TEMP/mobile-qa/audio-check.log"
      - name: Build unsigned arm64 iPhoneOS IPA
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-release"
          bash tools/build-ios-unsigned-ipa.sh "$RUNNER_TEMP/mobile-release/DeskBoxMobile-0.7.0-unsigned.ipa"
          cp docs/MOBILE-HOLOGRAM-0.7.0.md "$RUNNER_TEMP/mobile-release/RELEASE-NOTES.md"
          cd "$RUNNER_TEMP/mobile-release"
          shasum -a 256 DeskBoxMobile-0.7.0-unsigned.ipa > SHA256SUMS.txt
      - name: Launch isolated native simulator routes at two iPhone sizes
        run: |
          bash tools/ios-hologram-smoke.sh "$RUNNER_TEMP/mobile-qa"
          python3 - "$RUNNER_TEMP/mobile-qa" <<'PY'
          import sys,json,pathlib
          p=pathlib.Path(sys.argv[1]);routes='home tasks task-editor projects incidents incident-editor ai ai-keyboard ai-large connection briefing conflicts hologram history settings settings-large'.split()
          for label in ['main','small']:
            for route in routes:
              m=json.loads((p/(label+'-'+route+'.json')).read_text())
              assert m['route']==route and m['active']
              assert (p/(label+'-'+route+'.png')).stat().st_size>1000
          print('PASS complete native UI matrix: 32 routes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBoxMobile-0.7.0-Review
          path: ${{ runner.temp }}/mobile-qa/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBoxMobile-unsigned-iphone-ipa
          path: ${{ runner.temp }}/mobile-release/
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/ios-hologram-0.7.0'
    needs: unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeskBoxMobile-unsigned-iphone-ipa
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: DeskBoxMobile-0.7.0-Review
          path: review
      - name: Publish the verified unsigned iPhone test package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0-mobile-hologram release/DeskBoxMobile-0.7.0-unsigned.ipa release/SHA256SUMS.txt review/main-hologram.png review/small-hologram.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'DeskBox Mobile 0.7.0 - holographic voice preview' --notes-file release/RELEASE-NOTES.md
