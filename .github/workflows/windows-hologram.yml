name: Windows hologram candidate
on:
  pull_request:
    paths: ['src/**', 'assets/**', 'public/assets/**', 'packaging/**', 'build.ps1', 'tools/silverwing-accept.cs', 'tools/package-windows.ps1', 'tools/setup-accept.ps1', 'tools/rollback-install.ps1', 'tools/ui-regression.ps1', 'tools/prepare-ci-display.ps1', '.github/workflows/windows-hologram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native DeskBox
        shell: powershell
        run: .\build.ps1 -OutDir dist -NoPause
      - name: Exercise isolated native projection and preview
        timeout-minutes: 2
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /out:dist\silverwing-accept.exe tools\silverwing-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance host compile failed' }
          & .\dist\silverwing-accept.exe .\dist\DeskBox.exe .\dist\hologram-qa
          if ($LASTEXITCODE -ne 0) { throw 'Native hologram checks failed' }
          Get-FileHash .\dist\DeskBox.exe -Algorithm SHA256 | Format-List | Out-File .\dist\SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Native-Silverwing
          path: |
            dist/DeskBox.exe
            dist/SHA256.txt
            dist/hologram-qa/
          if-no-files-found: error
      - name: Prepare Windows installer compiler
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Package Windows setup
        shell: powershell
        run: .\tools\package-windows.ps1
      - name: Verify installation, upgrade, rollback and installed UI
        timeout-minutes: 8
        shell: powershell
        run: .\tools\setup-accept.ps1 -SetupPath .\dist\installer\DeskBox-2.1.0-hologram.1-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Windows-Setup
          path: dist/installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Windows-Install-Checks
          path: |
            dist/installer-qa/*.log
            dist/installer-qa/*.json
            dist/installer-qa/*.png
            dist/installer-qa/installed-hologram/
            dist/ui-qa-*/*.log
            dist/ui-qa-*/**/*.png
