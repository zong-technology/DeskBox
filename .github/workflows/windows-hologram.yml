name: Windows hologram candidate
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'github-hosted 使用 GitHub 标准云端构建机；self-hosted 需事先登记专用测试机'
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
      publish:
        description: '全部检查通过后发布测试安装包（需要仓库写权限）'
        type: boolean
        default: false
      comparison_release:
        description: '为已发布的 TIA 安装版发布截图对照附件，填写版本标签'
        type: string
        default: ''
concurrency:
  group: local-release-Windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native:
    if: inputs.comparison_release == ''
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ${{ inputs.runner == 'github-hosted' && 'windows-latest' || fromJSON('["self-hosted","Windows","deskbox-qa"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native DeskBox
        shell: powershell
        run: .\build.ps1 -OutDir dist -NoPause
      - name: Read the compiled version
        id: version
        shell: powershell
        run: |
          $v = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path dist\DeskBox.exe)).ProductVersion
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Exercise isolated native projection and preview
        timeout-minutes: 2
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\silverwing-accept.exe tools\silverwing-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance host compile failed' }
          New-Item -ItemType Directory -Force dist\hologram-qa | Out-Null
          & .\dist\silverwing-accept.exe .\dist\DeskBox.exe .\dist\hologram-qa | Tee-Object .\dist\hologram-qa\native-build-checks.log
          if ($LASTEXITCODE -ne 0) { throw 'Native hologram checks failed' }
          (Get-FileHash .\dist\DeskBox.exe -Algorithm SHA256).Hash | Set-Content -Encoding ascii .\dist\hologram-qa\native-build-checks.log.sha256
          Get-FileHash .\dist\DeskBox.exe -Algorithm SHA256 | Format-List | Out-File .\dist\SHA256.txt
      - name: Verify real application operations through the phone job channel
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\ai-operation-accept.exe tools\ai-operation-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Operation acceptance compile failed' }
          & .\dist\ai-operation-accept.exe | Tee-Object dist\hologram-qa\ai-operation-accept.log
          if ($LASTEXITCODE -ne 0) { throw 'Real operation acceptance failed' }
      - name: Verify phone task metadata and restart deletion synchronization
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\task-sync-fidelity-accept.exe tools\task-sync-fidelity-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Task synchronization acceptance compile failed' }
          & .\dist\task-sync-fidelity-accept.exe | Tee-Object dist\hologram-qa\task-sync-fidelity-accept.log
          if ($LASTEXITCODE -ne 0) { throw 'Task synchronization fidelity failed' }
      - name: Recheck existing sync bridge, conflicts and cloud credentials with synthetic data
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          foreach ($suite in @('mobile-bridge-accept','sync-conflicts-accept','cloud-sync-accept')) {
            & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe ("/out:dist\"+$suite+'.exe') ("tools\"+$suite+'.cs')
            if ($LASTEXITCODE -ne 0) { throw ($suite+' failed to compile') }
            & (".\dist\"+$suite+'.exe') | Tee-Object ("dist\hologram-qa\"+$suite+'.log')
            if ($LASTEXITCODE -ne 0) { throw ($suite+' failed') }
          }
      - name: Check all AI environment gates, separate histories and real redirect isolation
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\ai-environment-accept.exe tools\ai-environment-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'AI environment acceptance failed to compile' }
          & .\dist\ai-environment-accept.exe | Tee-Object dist\hologram-qa\ai-environment-accept.log
          if ($LASTEXITCODE -ne 0) { throw 'AI isolation checks failed' }
      - name: Check text AI project lookup and creation with a local model fixture
        timeout-minutes: 3
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $mock = Start-Process node -ArgumentList 'tools\mock-ai-server.js' -PassThru -WindowStyle Hidden -RedirectStandardOutput dist\hologram-qa\mock.stdout.log -RedirectStandardError dist\hologram-qa\mock.stderr.log
          try {
            $connected = $false
            for ($i=0; $i -lt 30; $i++) {
              if ($mock.HasExited) { Get-Content dist\hologram-qa\mock.stderr.log; throw 'Local AI fixture exited before accepting requests' }
              $probe = New-Object System.Net.Sockets.TcpClient
              try { if ($probe.ConnectAsync('127.0.0.1',18080).Wait(200)) { $connected = $probe.Connected; if ($connected) { break } } } catch { } finally { $probe.Dispose() }
              Start-Sleep -Milliseconds 100
            }
            if (-not $connected) { throw 'Local AI fixture did not open its port' }
            $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/health -TimeoutSec 5
            if ($health.StatusCode -ne 200) { throw 'Local AI fixture unavailable' }
            & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\mobile-ai-accept.exe tools\mobile-ai-accept.cs
            if ($LASTEXITCODE -ne 0) { throw 'Text AI acceptance compile failed' }
            & .\dist\mobile-ai-accept.exe | Tee-Object dist\hologram-qa\mobile-ai-accept.log
            if ($LASTEXITCODE -ne 0) { throw 'Text AI operation checks failed' }
          } finally { if (-not $mock.HasExited) { Stop-Process -Id $mock.Id -Force } }
      - name: Verify the headless Agent Runtime and third-party MCP protocols
        timeout-minutes: 3
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\v5-runtime-accept.exe tools\v5-runtime-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime acceptance compile failed' }
          $python = (Get-Command python).Source
          & .\dist\v5-runtime-accept.exe $python (Resolve-Path tools\v5-mcp-stdio-fixture.py).Path | Tee-Object dist\hologram-qa\v5-runtime-accept.log
          if ($LASTEXITCODE -ne 0) { throw 'Runtime and MCP protocol acceptance failed' }
      - name: Verify Engineering OS project isolation and capture native WinForms routes
        id: v5_ui
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        run: |
          $env:DESKBOX_MCP_TEST_PYTHON = (Get-Command python).Source
          .\tools\prepare-ci-display.ps1
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\v5-context-accept.exe tools\v5-context-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Engineering OS acceptance compile failed' }
          New-Item -ItemType Directory -Force dist\v5-qa | Out-Null
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\v5-stream-accept.exe tools\v5-stream-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Project streaming acceptance compile failed' }
          & .\dist\v5-stream-accept.exe | Tee-Object dist\v5-qa\stream-accept.log
          if ($LASTEXITCODE -ne 0) { throw 'Project streaming acceptance failed' }
          $display = @([DeskBoxCIDisplay]::GetSystemMetrics(0),[DeskBoxCIDisplay]::GetSystemMetrics(1))
          foreach ($resolution in @(@(3840,2160),@(2560,1440))) {
            $result = [DeskBoxCIDisplay]::SetSize($resolution[0],$resolution[1])
            Write-Output ("Display request " + ($resolution -join 'x') + " returned " + $result)
            if ($result -eq 0) { break }
          }
          try {
            & .\dist\v5-context-accept.exe .\dist\v5-qa 96 | Tee-Object dist\v5-qa\context-accept-96.log
            if ($LASTEXITCODE -ne 0) { throw 'Engineering OS project context or UI acceptance failed at 96 DPI' }
            if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted') {
              $scale = $null
              try { $scale = [DeskBoxCIDisplay]::ReadScale() } catch { Write-Output ("BLOCKED DPI matrix: " + $_.Exception.Message) }
              if ($scale) {
                foreach ($dpi in 120,144,192) {
                  $relative = $scale.Minimum + ($dpi - 96) / 24
                  if ($relative -gt $scale.Maximum) { Write-Output "BLOCKED DPI ${dpi}: display does not support this scale"; continue }
                  $result = [DeskBoxCIDisplay]::SetScale($scale, [int]$relative)
                  if ($result -ne 0) { Write-Output "BLOCKED DPI ${dpi}: display request returned $result"; continue }
                  try {
                    Start-Sleep -Milliseconds 750
                    & .\dist\v5-context-accept.exe .\dist\v5-qa $dpi | Tee-Object ("dist\v5-qa\context-accept-" + $dpi + ".log")
                    if ($LASTEXITCODE -ne 0) { throw ("Engineering OS project context or UI acceptance failed at " + $dpi + " DPI") }
                  } finally {
                    if ([DeskBoxCIDisplay]::SetScale($scale, $scale.Current) -ne 0) { throw 'Failed to restore runner scale' }
                  }
                }
              }
            }
          } finally {
            if ([DeskBoxCIDisplay]::SetSize($display[0],$display[1]) -ne 0) { throw 'Failed to restore runner display size' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-V5-Engineering-UI
          path: dist/v5-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble the native animated preview
        shell: powershell
        run: .\tools\render-hologram-preview.ps1
      - name: Prepare Windows installer compiler
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Package Windows setup
        shell: powershell
        run: .\tools\package-windows.ps1
      - name: Build the TIA acceptance tool and export its labeled fixtures
        id: tia_fixture
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /define:TIA_WINFORMS /main:TiaEngineerAcceptance /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:dist\DeskBox.exe /out:dist\tia-engineer-accept.exe tools\tia-engineer-accept.cs tools\render-v4-ui.cs
          if ($LASTEXITCODE -ne 0) { throw 'TIA acceptance host compile failed' }
          & .\dist\tia-engineer-accept.exe .\dist\installer-fixtures --capture-inputs
          if ($LASTEXITCODE -ne 0) { throw 'TIA screenshot inputs could not be prepared' }
      - name: Verify installation, upgrade, rollback and installed UI
        timeout-minutes: 8
        shell: powershell
        run: .\tools\setup-accept.ps1 -SetupPath ('.\dist\installer\DeskBox-${{ steps.version.outputs.version }}-Setup.exe') -TiaFixtureDir .\dist\installer-fixtures -BuiltNativeLog .\dist\hologram-qa\native-build-checks.log
      - name: Validate the TIA workbench with offline export fixtures and capture native UI
        if: ${{ !cancelled() && steps.tia_fixture.outcome == 'success' }}
        shell: powershell
        timeout-minutes: 3
        run: |
          $tokens = $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools\tia-v20-smoke.ps1).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          & .\dist\tia-engineer-accept.exe .\dist\hologram-qa\tia | Tee-Object dist\hologram-qa\tia-engineer.log
          if ($LASTEXITCODE -ne 0) { throw 'TIA workbench acceptance failed' }
          Compress-Archive -Path .\dist\hologram-qa\tia\v43-programming-output\* -DestinationPath .\dist\hologram-qa\tia\v43-programming-output.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Native-Silverwing
          retention-days: 3
          path: |
            dist/DeskBox.exe
            dist/SHA256.txt
            dist/hologram-qa/
          if-no-files-found: error
      - name: Write installation verification report
        shell: powershell
        run: |
          .\tools\write-install-report.ps1
          Copy-Item -LiteralPath .\dist\installer-qa\installed-tia-input.png -Destination .\dist\installer
          Copy-Item -LiteralPath .\dist\installer-qa\installed-tia-screenshots.zip -Destination .\dist\installer
          Copy-Item -LiteralPath .\dist\installer-qa\installed-tia-environment.json -Destination .\dist\installer
          Get-ChildItem .\dist\installer-qa\installed-tia-dpi-*.png | Copy-Item -Destination .\dist\installer
          Get-ChildItem .\dist\installer-qa\installed-v43-*.png | Copy-Item -Destination .\dist\installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Windows-Setup
          retention-days: 7
          path: dist/installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Windows-Install-Checks
          retention-days: 3
          path: |
            dist/installer-qa/*.log
            dist/installer-qa/*.json
            dist/installer-qa/*.png
            dist/installer-qa/installed-hologram/
            dist/ui-qa-*/*.log
            dist/ui-qa-*/**/*.png
      - name: Require successful Engineering OS acceptance
        if: always() && steps.v5_ui.outcome != 'success'
        shell: powershell
        run: throw 'Engineering OS acceptance did not pass; inspect the captured evidence.'
  publish:
    if: inputs.publish && inputs.comparison_release == ''
    needs: native
    runs-on: ${{ inputs.runner == 'github-hosted' && 'windows-latest' || fromJSON('["self-hosted","Windows","deskbox-qa"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeskBox-Windows-Setup
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: DeskBox-Native-Silverwing
          path: native-preview
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Publish the verified Windows test installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.native.outputs.version }}
        shell: powershell
        run: |
          $tia = '.\native-preview\hologram-qa\tia'
          $attachments = @(
            ('.\installer\DeskBox-'+$env:RELEASE_VERSION+'-Setup.exe')
            '.\installer\SHA256SUMS.txt'
            '.\installer\INSTALL-TEST-REPORT.md'
            '.\installer\installed-tia-input.png'
            '.\installer\installed-tia-screenshots.zip'
            '.\installer\installed-tia-environment.json'
            '.\native-preview\hologram-qa\hologram-motion.gif'
          )
          $attachments += @('tia-workbench-1920.png', 'tia-workbench-1600.png', 'tia-workbench-1024.png', 'tia-diagnostics.png', 'tia-hardware.png', 'tia-rack-layout.png', 'tia-networks.png', 'tia-network-endpoints.png', 'tia-diff.png', 'tia-references.png', 'tia-voice.png', 'tia-analysis.png', 'tia-variables.png', 'tia-editor-narrow.png', 'tia-empty.png', 'tia-task-running.png', 'tia-environment.png', 'tia-operation-history.png') | ForEach-Object { Join-Path $tia $_ }
          $attachments += @(Get-ChildItem .\installer\installed-tia-dpi-*.png | ForEach-Object FullName)
          $attachments += @(Get-ChildItem .\installer\installed-v43-*.png | ForEach-Object FullName)
          $attachments += @('tia-v43-binding.png', 'tia-v43-programming.png', 'v43-programming-output.zip') | ForEach-Object { Join-Path $tia $_ }
          gh release create ('v'+$env:RELEASE_VERSION) @attachments --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title ('DeskBox '+$env:RELEASE_VERSION+' Windows preview') --notes-file .\source\packaging\RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
  comparison:
    if: inputs.comparison_release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the indexed comparison of the two installed UI captures
        env:
          GH_TOKEN: ${{ github.token }}
          TIA_REVIEW_TAG: ${{ inputs.comparison_release }}
        run: |
          [[ "$TIA_REVIEW_TAG" =~ ^v4\.2\.2-ui\.[0-9]+$ ]]
          gh release download v4.2.2-ui.3 --pattern installed-tia-screenshots.zip --dir evidence/before
          gh release download "$TIA_REVIEW_TAG" --pattern installed-tia-screenshots.zip --dir evidence/after
          python3 tools/installed-tia-comparison.py evidence/before/installed-tia-screenshots.zip evidence/after/installed-tia-screenshots.zip evidence/DeskBox-TIA-before-after.zip "$TIA_REVIEW_TAG"
          gh release create "$TIA_REVIEW_TAG-evidence" evidence/DeskBox-TIA-before-after.zip \
            --target "$GITHUB_SHA" --prerelease --title "DeskBox $TIA_REVIEW_TAG TIA install screenshot comparison" \
            --notes "Twelve paired screenshots, with an offline HTML comparison and a per-image evidence index. Installed build: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TIA_REVIEW_TAG"
