name: Windows hologram candidate
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'github-hosted 使用 GitHub 标准云端构建机；self-hosted 需事先登记专用测试机'
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
      publish:
        description: '全部检查通过后发布测试安装包（需要仓库写权限）'
        type: boolean
        default: false
concurrency:
  group: local-release-Windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ${{ inputs.runner == 'github-hosted' && 'windows-latest' || fromJSON('["self-hosted","Windows","deskbox-qa"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native DeskBox
        shell: powershell
        run: .\build.ps1 -OutDir dist -NoPause
      - name: Read the compiled version
        id: version
        shell: powershell
        run: |
          $v = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path dist\DeskBox.exe)).ProductVersion
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Exercise isolated native projection and preview
        timeout-minutes: 2
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\silverwing-accept.exe tools\silverwing-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance host compile failed' }
          & .\dist\silverwing-accept.exe .\dist\DeskBox.exe .\dist\hologram-qa
          if ($LASTEXITCODE -ne 0) { throw 'Native hologram checks failed' }
          Get-FileHash .\dist\DeskBox.exe -Algorithm SHA256 | Format-List | Out-File .\dist\SHA256.txt
      - name: Verify real application operations through the phone job channel
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\ai-operation-accept.exe tools\ai-operation-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Operation acceptance compile failed' }
          & .\dist\ai-operation-accept.exe | Tee-Object dist\hologram-qa\ai-operation-accept.log
          if ($LASTEXITCODE -ne 0) { throw 'Real operation acceptance failed' }
      - name: Verify phone task metadata and restart deletion synchronization
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\task-sync-fidelity-accept.exe tools\task-sync-fidelity-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'Task synchronization acceptance compile failed' }
          & .\dist\task-sync-fidelity-accept.exe | Tee-Object dist\hologram-qa\task-sync-fidelity-accept.log
          if ($LASTEXITCODE -ne 0) { throw 'Task synchronization fidelity failed' }
      - name: Recheck existing sync bridge, conflicts and cloud credentials with synthetic data
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          foreach ($suite in @('mobile-bridge-accept','sync-conflicts-accept','cloud-sync-accept')) {
            & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe ("/out:dist\"+$suite+'.exe') ("tools\"+$suite+'.cs')
            if ($LASTEXITCODE -ne 0) { throw ($suite+' failed to compile') }
            & (".\dist\"+$suite+'.exe') | Tee-Object ("dist\hologram-qa\"+$suite+'.log')
            if ($LASTEXITCODE -ne 0) { throw ($suite+' failed') }
          }
      - name: Check all AI environment gates, separate histories and real redirect isolation
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\ai-environment-accept.exe tools\ai-environment-accept.cs
          if ($LASTEXITCODE -ne 0) { throw 'AI environment acceptance failed to compile' }
          & .\dist\ai-environment-accept.exe | Tee-Object dist\hologram-qa\ai-environment-accept.log
          if ($LASTEXITCODE -ne 0) { throw 'AI isolation checks failed' }
      - name: Check text AI project lookup and creation with a local model fixture
        timeout-minutes: 3
        shell: powershell
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $mock = Start-Process node -ArgumentList 'tools\mock-ai-server.js' -PassThru -WindowStyle Hidden -RedirectStandardOutput dist\hologram-qa\mock.stdout.log -RedirectStandardError dist\hologram-qa\mock.stderr.log
          try {
            $connected = $false
            for ($i=0; $i -lt 30; $i++) {
              if ($mock.HasExited) { Get-Content dist\hologram-qa\mock.stderr.log; throw 'Local AI fixture exited before accepting requests' }
              $probe = New-Object System.Net.Sockets.TcpClient
              try { if ($probe.ConnectAsync('127.0.0.1',18080).Wait(200)) { $connected = $probe.Connected; if ($connected) { break } } } catch { } finally { $probe.Dispose() }
              Start-Sleep -Milliseconds 100
            }
            if (-not $connected) { throw 'Local AI fixture did not open its port' }
            $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/health -TimeoutSec 5
            if ($health.StatusCode -ne 200) { throw 'Local AI fixture unavailable' }
            & $csc /nologo /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:dist\DeskBox.exe /out:dist\mobile-ai-accept.exe tools\mobile-ai-accept.cs
            if ($LASTEXITCODE -ne 0) { throw 'Text AI acceptance compile failed' }
            & .\dist\mobile-ai-accept.exe | Tee-Object dist\hologram-qa\mobile-ai-accept.log
            if ($LASTEXITCODE -ne 0) { throw 'Text AI operation checks failed' }
          } finally { if (-not $mock.HasExited) { Stop-Process -Id $mock.Id -Force } }
      - name: Assemble the native animated preview
        shell: powershell
        run: .\tools\render-hologram-preview.ps1
      - name: Prepare Windows installer compiler
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Package Windows setup
        shell: powershell
        run: .\tools\package-windows.ps1
      - name: Verify installation, upgrade, rollback and installed UI
        timeout-minutes: 8
        shell: powershell
        run: .\tools\setup-accept.ps1 -SetupPath ('.\dist\installer\DeskBox-${{ steps.version.outputs.version }}-Setup.exe')
      - name: Validate the TIA workbench with offline export fixtures and capture native UI
        shell: powershell
        timeout-minutes: 3
        run: |
          $tokens = $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools\tia-v20-smoke.ps1).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /define:TIA_WINFORMS /main:TiaEngineerAcceptance /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:dist\DeskBox.exe /out:dist\tia-engineer-accept.exe tools\tia-engineer-accept.cs tools\render-v4-ui.cs
          if ($LASTEXITCODE -ne 0) { throw 'TIA acceptance host compile failed' }
          & .\dist\tia-engineer-accept.exe .\dist\hologram-qa\tia | Tee-Object dist\hologram-qa\tia-engineer.log
          if ($LASTEXITCODE -ne 0) { throw 'TIA workbench acceptance failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Native-Silverwing
          retention-days: 3
          path: |
            dist/DeskBox.exe
            dist/SHA256.txt
            dist/hologram-qa/
          if-no-files-found: error
      - name: Write installation verification report
        shell: powershell
        run: |
          .\tools\write-install-report.ps1
          Copy-Item -LiteralPath .\dist\installer-qa\installed-tia-input.png -Destination .\dist\installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Windows-Setup
          retention-days: 7
          path: dist/installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskBox-Windows-Install-Checks
          retention-days: 3
          path: |
            dist/installer-qa/*.log
            dist/installer-qa/*.json
            dist/installer-qa/*.png
            dist/installer-qa/installed-hologram/
            dist/ui-qa-*/*.log
            dist/ui-qa-*/**/*.png
  publish:
    if: inputs.publish
    needs: native
    runs-on: ${{ inputs.runner == 'github-hosted' && 'windows-latest' || fromJSON('["self-hosted","Windows","deskbox-qa"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeskBox-Windows-Setup
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: DeskBox-Native-Silverwing
          path: native-preview
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Publish the verified Windows test installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.native.outputs.version }}
        shell: powershell
        run: |
          $tia = '.\native-preview\hologram-qa\tia'
          $attachments = @(
            ('.\installer\DeskBox-'+$env:RELEASE_VERSION+'-Setup.exe')
            '.\installer\SHA256SUMS.txt'
            '.\installer\INSTALL-TEST-REPORT.md'
            '.\installer\installed-tia-input.png'
            '.\native-preview\hologram-qa\hologram-motion.gif'
          )
          $attachments += @('tia-workbench-1920.png', 'tia-workbench-1600.png', 'tia-workbench-1024.png', 'tia-diagnostics.png', 'tia-hardware.png', 'tia-networks.png', 'tia-diff.png', 'tia-references.png', 'tia-voice.png') | ForEach-Object { Join-Path $tia $_ }
          gh release create ('v'+$env:RELEASE_VERSION) @attachments --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title ('DeskBox '+$env:RELEASE_VERSION+' Windows preview') --notes-file .\source\packaging\RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
