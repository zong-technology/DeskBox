name: DeskBox iOS simulator build
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'github-hosted 使用 GitHub 标准云端构建机；self-hosted 需事先登记专用测试机'
        type: choice
        options: [github-hosted, self-hosted]
        default: github-hosted
concurrency:
  group: local-release-macOS-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ${{ inputs.runner == 'github-hosted' && 'macos-latest' || fromJSON('["self-hosted","macOS","deskbox-qa"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native SwiftUI application
        run: |
          xcodebuild -version
          xcodebuild -project mobile/DeskBoxMobile/DeskBoxMobile.xcodeproj \
            -scheme DeskBoxMobile -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/deskbox-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/deskbox-ios/Build/Products/Debug-iphonesimulator/DeskBoxMobile.app" \
            "$RUNNER_TEMP/DeskBoxMobile-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBoxMobile-simulator-not-iphone
          path: ${{ runner.temp }}/DeskBoxMobile-simulator.zip
          retention-days: 7
